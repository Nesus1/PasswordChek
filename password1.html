<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasswordChek</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.05), 0 0 10px rgba(0,210,255,0.1); border: 1px solid #00d2ff; }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; color: #333; letter-spacing: 1px; }
        .input-box { position: relative; margin-bottom: 20px; }
        input { width: 100%; padding: 12px 40px 12px 15px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        input:focus { border-color: #00d2ff; box-shadow: 0 0 8px rgba(0,210,255,0.3); }
        .toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; }
        .bar-container { background: #eee; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
        .bar { height: 100%; width: 0%; background: #ff0055; transition: all 0.3s; }
        .status { padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 0.95rem; }
        .low { color: #ff0055; background: #ffe5ed; }
        .mid { color: #ffaa00; background: #fff6e5; }
        .high { color: #00e676; background: #e5fbf1; }
    </style>
</head>
<body>

    <div class="card">
        <h1>PasswordChek: Cyber Scanner</h1>
        <div class="input-box">
            <input type="password" id="pwd" placeholder="Введите ваш пароль...">
            <button class="toggle" id="eye">👁️</button>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:0.85rem; font-weight:bold;">
            <span>СКОРИНГ</span>
            <span id="score">0 / 23</span>
        </div>
        <div class="bar-container"><div class="bar" id="progress"></div></div>
        <div class="status low" id="status">🔴 УРОВЕНЬ: НИЗКИЙ</div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const english = /[a-zA-Z]/, russian = /[а-яА-ЯёЁ]/, spanish = /[ñáéíóúüÑÁÉÍÓÚÜ]/, french = /[àâæçéèêëîïôœùûüÿÀÂÆÇÉÈÊËÎÏÔŒÙÛÜŸ]/, special = /[+_*&!@#$%^()\-/[\]|]/;

        $('eye').onclick = () => {
            $('pwd').type = $('pwd').type === 'password' ? 'text' : 'password';
        };

        $('pwd').oninput = function() {
            let pass = this.value, count = 0;
            if (!pass) return update(0);

            if (pass.length >= 8) count++;
            if ((pass.match(/[A-ZА-ЯЁ]/g) || []).length >= 3) count++; else count++; // По логике вашего Python-кода

            let digits = (pass.match(/\d/g) || []).length;
            if (digits >= 1) count++;
            if (digits >= 3) count++;

            let specCount = 0;
            for(let c of pass) if(special.test(c)) specCount++;
            if (specCount >= 1) count++;
            if (specCount >= 3) count++;

            let langCount = 0;
            for(let c of pass) if(english.test(c) || russian.test(c) || spanish.test(c) || french.test(c)) langCount++;
            if (langCount >= 3) count++;

            let hasEng = english.test(pass), hasRus = russian.test(pass), hasSpan = spanish.test(pass), hasFren = french.test(pass);
            if (hasEng && hasRus) count += 6;
            if (hasEng && hasSpan) count += 6;
            if (hasEng && hasFren) count += 6;

            update(Math.min(count, 23));
        };

        function update(score) {
            $('score').textContent = `${score} / 23`;
            $('progress').style.width = `${(score / 23) * 100}%`;
            
            let cl = 'low', txt = '🔴 УРОВЕНЬ: НИЗКИЙ', col = '#ff0055';
            if (score >= 6 && score <= 10) { cl = 'mid'; txt = '🟡 УРОВЕНЬ: СРЕДНИЙ'; col = '#ffaa00'; }
            else if (score > 10) { cl = 'high'; txt = '🟢 УРОВЕНЬ: ВЫСОКИЙ'; col = '#00e676'; }

            $('status').className = `status ${cl}`;
            $('status').textContent = txt;
            $('progress').style.backgroundColor = col;
        }
    </script>
</body>
</html>
