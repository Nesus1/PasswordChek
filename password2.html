<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS PasswordChek: Cyber Security Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.85);
            --neon-cyan: #00e5ff;
            --neon-blue: #2979ff;
            --neon-purple: #b388ff;
            --neon-green: #00e676;
            --neon-yellow: #ffea00;
            --neon-red: #ff1744;
            --neon-orange: #ff9100;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8a8aa0;
            --grid-color: rgba(41, 121, 255, 0.08);
            --shadow-sm: 0 2px 8px rgba(41, 121, 255, 0.08);
            --shadow-md: 0 8px 32px rgba(41, 121, 255, 0.12);
            --shadow-glow-cyan: 0 0 20px rgba(0, 229, 255, 0.3), 0 0 40px rgba(0, 229, 255, 0.1);
            --shadow-glow-blue: 0 0 20px rgba(41, 121, 255, 0.3), 0 0 40px rgba(41, 121, 255, 0.1);
            --shadow-glow-green: 0 0 20px rgba(0, 230, 118, 0.3), 0 0 40px rgba(0, 230, 118, 0.1);
            --shadow-glow-yellow: 0 0 20px rgba(255, 234, 0, 0.3), 0 0 40px rgba(255, 234, 0, 0.1);
            --shadow-glow-red: 0 0 20px rgba(255, 23, 68, 0.3), 0 0 40px rgba(255, 23, 68, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Geometric grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 8s infinite ease-in-out;
            box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
        }

        @keyframes floatParticle {
            0%, 100% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* Header */
        .header {
            text-align: center;
            animation: fadeInDown 0.8s ease-out;
        }

        .header-badge {
            display: inline-block;
            padding: 6px 18px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(179, 136, 255, 0.1));
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--neon-blue);
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            animation: pulseBorder 3s infinite;
        }

        @keyframes pulseBorder {
            0%, 100% { border-color: rgba(0, 229, 255, 0.3); box-shadow: 0 0 10px rgba(0, 229, 255, 0.1); }
            50% { border-color: rgba(0, 229, 255, 0.6); box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--text-primary), var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Main Card */
        .main-card {
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(41, 121, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-md);
            animation: fadeInUp 0.8s ease-out 0.2s both;
            position: relative;
            overflow: hidden;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue), var(--neon-purple));
            animation: shimmer 3s infinite linear;
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Input Section */
        .input-section {
            margin-bottom: 32px;
        }

        .input-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: block;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input {
            width: 100%;
            padding: 18px 56px 18px 24px;
            font-family: 'Roboto Mono', monospace;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(41, 121, 255, 0.2);
            border-radius: 16px;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .password-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .password-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: var(--shadow-glow-cyan);
            background: #ffffff;
        }

        .toggle-password {
            position: absolute;
            right: 18px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--text-muted);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: var(--neon-blue);
            transform: scale(1.1);
        }

        .toggle-password svg {
            width: 22px;
            height: 22px;
        }

        /* Scan Button */
        .scan-btn {
            width: 100%;
            margin-top: 16px;
            padding: 16px 32px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
            border: none;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(41, 121, 255, 0.3);
        }

        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(41, 121, 255, 0.4), var(--shadow-glow-blue);
        }

        .scan-btn:active {
            transform: translateY(0);
        }

        .scan-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 40%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 60%
            );
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* Results Section */
        .results-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 8px;
        }

        @media (max-width: 640px) {
            .results-section {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .main-card {
                padding: 24px;
            }
        }

        /* Circular Score */
        .score-card {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(41, 121, 255, 0.1);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: all 0.5s ease;
        }

        .score-card.glow-green { box-shadow: var(--shadow-glow-green); border-color: rgba(0, 230, 118, 0.3); }
        .score-card.glow-yellow { box-shadow: var(--shadow-glow-yellow); border-color: rgba(255, 234, 0, 0.3); }
        .score-card.glow-red { box-shadow: var(--shadow-glow-red); border-color: rgba(255, 23, 68, 0.3); }

        .circular-chart {
            position: relative;
            width: 160px;
            height: 160px;
        }

        .circular-chart svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .circle-bg {
            fill: none;
            stroke: rgba(41, 121, 255, 0.1);
            stroke-width: 10;
        }

        .circle-progress {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.5s ease;
            filter: drop-shadow(0 0 6px currentColor);
        }

        .score-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-primary);
            text-shadow: 0 0 20px rgba(41, 121, 255, 0.2);
        }

        .score-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* Status Card */
        .status-card {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(41, 121, 255, 0.1);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            transition: all 0.5s ease;
        }

        .status-card.glow-green { box-shadow: var(--shadow-glow-green); border-color: rgba(0, 230, 118, 0.3); }
        .status-card.glow-yellow { box-shadow: var(--shadow-glow-yellow); border-color: rgba(255, 234, 0, 0.3); }
        .status-card.glow-red { box-shadow: var(--shadow-glow-red); border-color: rgba(255, 23, 68, 0.3); }

        .status-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 10px currentColor);
            animation: statusPulse 2s infinite ease-in-out;
        }

        @keyframes statusPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Criteria Breakdown */
        .criteria-section {
            width: 100%;
            margin-top: 8px;
        }

        .criteria-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .criteria-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--neon-cyan);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .criterion {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(41, 121, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .criterion:hover {
            transform: translateX(4px);
            border-color: rgba(41, 121, 255, 0.25);
            box-shadow: var(--shadow-sm);
        }

        .criterion-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .criterion-icon.pass {
            background: rgba(0, 230, 118, 0.12);
            color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.2);
        }

        .criterion-icon.fail {
            background: rgba(255, 23, 68, 0.08);
            color: var(--neon-red);
        }

        .criterion-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .criterion-text strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .footer span {
            color: var(--neon-blue);
        }

        /* Scanning animation overlay */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0;
            pointer-events: none;
        }

        .scanning .scan-line {
            animation: scanDown 0.6s ease-out;
        }

        @keyframes scanDown {
            0% { top: 0; opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Real-time indicator */
        .realtime-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            color: var(--neon-green);
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .realtime-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>

    <div class="container">

                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <div class="realtime-badge">
                    <span class="realtime-dot"></span>
                    <span>Анализ в реальном времени</span>
                </div>
                <button class="scan-btn" id="scanBtn">Сканировать</button>
            </div>

            <div class="results-section" id="resultsSection" style="opacity:0; transform: translateY(10px); transition: all 0.5s ease;">
                <div class="score-card" id="scoreCard">
                    <div class="score-label">Баллы</div>
                    <div class="circular-chart">
                        <svg viewBox="0 0 160 160">
                            <circle class="circle-bg" cx="80" cy="80" r="70"></circle>
                            <circle class="circle-progress" id="circleProgress" cx="80" cy="80" r="70"
                                stroke-dasharray="439.82"
                                stroke-dashoffset="439.82"
                                stroke="#2979ff"></circle>
                        </svg>
                        <div class="score-value" id="scoreValue">0</div>
                    </div>
                    <div class="score-label">из 23</div>
                </div>

                <div class="status-card" id="statusCard">
                    <div class="status-icon" id="statusIcon">🔒</div>
                    <div class="status-text" id="statusText">ВВЕДИТЕ ПАРОЛЬ</div>
                    <div class="status-desc" id="statusDesc">Введите пароль для начала сканирования безопасности</div>
                </div>
            </div>

            <div class="criteria-section" id="criteriaSection" style="opacity:0; transform: translateY(10px); transition: all 0.5s ease;">
                <div class="criteria-title">Детальный разбор</div>
                <div class="criteria-grid" id="criteriaGrid"></div>
            </div>
        </main>

        <footer class="footer">
            <span>NS PasswordChek</span> — Защити свои данные
        </footer>

    <script>
        // Character sets
        const ENGLISH = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const RUSSIAN = "абвгдеёжзийклмнопрстуфхцчшщъыьэюяАБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
        const SPANISH = "ñáéíóúüÑÁÉÍÓÚÜ";
        const FRENCH = "àâæçéèêëîïôœùûüÿÀÂÆÇÉÈÊËÎÏÔŒÙÛÜŸ";
        const SPECIAL = "+_=*&!@#$%^()-/||";

        // DOM Elements
        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');
        const scanBtn = document.getElementById('scanBtn');
        const mainCard = document.getElementById('mainCard');
        const resultsSection = document.getElementById('resultsSection');
        const criteriaSection = document.getElementById('criteriaSection');
        const circleProgress = document.getElementById('circleProgress');
        const scoreValue = document.getElementById('scoreValue');
        const scoreCard = document.getElementById('scoreCard');
        const statusCard = document.getElementById('statusCard');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const statusDesc = document.getElementById('statusDesc');
        const criteriaGrid = document.getElementById('criteriaGrid');

        // Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 8 + 's';
            p.style.animationDuration = (6 + Math.random() * 6) + 's';
            const colors = ['var(--neon-cyan)', 'var(--neon-blue)', 'var(--neon-purple)'];
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.boxShadow = `0 0 10px ${p.style.background}, 0 0 20px ${p.style.background}`;
            particlesContainer.appendChild(p);
        }

        // Toggle password visibility
        let isVisible = false;
        togglePassword.addEventListener('click', () => {
            isVisible = !isVisible;
            passwordInput.type = isVisible ? 'text' : 'password';
            eyeIcon.style.display = isVisible ? 'none' : 'block';
            eyeOffIcon.style.display = isVisible ? 'block' : 'none';
        });

        // Count occurrences
        function countChars(str, charset) {
            let count = 0;
            for (const ch of str) {
                if (charset.includes(ch)) count++;
            }
            return count;
        }

        function countUppercase(str) {
            let count = 0;
            for (const ch of str) {
                if (ch >= 'A' && ch <= 'Z') count++;
                // Also check Russian uppercase
                if ("АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ".includes(ch)) count++;
                // Spanish uppercase
                if ("ÑÁÉÍÓÚÜ".includes(ch)) count++;
                // French uppercase
                if ("ÀÂÆÇÉÈÊËÎÏÔŒÙÛÜŸ".includes(ch)) count++;
            }
            return count;
        }

        // Calculate score
        function calculateScore(password) {
            let count = 0;
            const details = [];

            // Length >= 8
            const hasLength = password.length >= 8;
            if (hasLength) {
                count += 1;
                details.push({ label: 'Длина ≥ 8 символов', pass: true, points: '+1' });
            } else {
                details.push({ label: 'Длина ≥ 8 символов', pass: false, points: '0' });
            }

            // Uppercase >= 3
            const upperCount = countUppercase(password);
            const hasUpper = upperCount >= 3;
            if (hasUpper) {
                count += 1;
                details.push({ label: `Заглавных букв ≥ 3 (${upperCount})`, pass: true, points: '+1' });
            } else {
                details.push({ label: `Заглавных букв ≥ 3 (${upperCount})`, pass: false, points: '0' });
            }

            // Digits
            let digitCount = 0;
            for (const ch of password) {
                if (/\d/.test(ch)) digitCount++;
            }
            let digitPoints = 0;
            if (digitCount >= 1) { count += 1; digitPoints += 1; }
            if (digitCount >= 3) { count += 1; digitPoints += 1; }
            details.push({
                label: `Цифры (${digitCount})`,
                pass: digitPoints > 0,
                points: digitPoints > 0 ? `+${digitPoints}` : '0',
                extra: digitCount >= 3 ? '≥3 цифры' : (digitCount >= 1 ? '≥1 цифра' : 'нет цифр')
            });

            // Special chars
            const specialCount = countChars(password, SPECIAL);
            let specialPoints = 0;
            if (specialCount >= 1) { count += 1; specialPoints += 1; }
            if (specialCount >= 3) { count += 1; specialPoints += 1; }
            details.push({
                label: `Спецсимволы (${specialCount})`,
                pass: specialPoints > 0,
                points: specialPoints > 0 ? `+${specialPoints}` : '0',
                extra: specialCount >= 3 ? '≥3 символа' : (specialCount >= 1 ? '≥1 символ' : 'нет символов')
            });

            // Language pools
            const engCount = countChars(password, ENGLISH);
            const rusCount = countChars(password, RUSSIAN);
            const spanCount = countChars(password, SPANISH);
            const frenCount = countChars(password, FRENCH);
            const totalLetters = engCount + rusCount + spanCount + frenCount;

            const hasPool = totalLetters >= 3;
            if (hasPool) {
                count += 1;
                details.push({ label: `Языковые буквы ≥ 3 (${totalLetters})`, pass: true, points: '+1' });
            } else {
                details.push({ label: `Языковые буквы ≥ 3 (${totalLetters})`, pass: false, points: '0' });
            }

            // Mixed language bonuses
            const hasEngRus = engCount > 0 && rusCount > 0;
            const hasEngSpan = engCount > 0 && spanCount > 0;
            const hasEngFren = engCount > 0 && frenCount > 0;

            if (hasEngRus) {
                count += 6;
                details.push({ label: 'Английский + Русский', pass: true, points: '+6' });
            } else {
                details.push({ label: 'Английский + Русский', pass: false, points: '0' });
            }

            if (hasEngSpan) {
                count += 6;
                details.push({ label: 'Английский + Испанский', pass: true, points: '+6' });
            } else {
                details.push({ label: 'Английский + Испанский', pass: false, points: '0' });
            }

            if (hasEngFren) {
                count += 6;
                details.push({ label: 'Английский + Французский', pass: true, points: '+6' });
            } else {
                details.push({ label: 'Английский + Французский', pass: false, points: '0' });
            }

            return { score: count, details };
        }

        function getStatus(score) {
            if (score <= 5) {
                return {
                    level: 'НИЗКИЙ',
                    icon: '🔴',
                    color: 'var(--neon-red)',
                    desc: 'Пароль легко взломать. Добавьте цифры, спецсимволы и смешайте языки.',
                    glow: 'glow-red'
                };
            } else if (score <= 10) {
                return {
                    level: 'СРЕДНИЙ',
                    icon: '🟡',
                    color: 'var(--neon-yellow)',
                    desc: 'Пароль имеет среднюю защиту. Рекомендуется усилить сложность.',
                    glow: 'glow-yellow'
                };
            } else {
                return {
                    level: 'ВЫСОКИЙ',
                    icon: '🟢',
                    color: 'var(--neon-green)',
                    desc: 'Отличная защита! Пароль имеет высокий уровень безопасности.',
                    glow: 'glow-green'
                };
            }
        }

        function animateValue(element, start, end, duration) {
            const range = end - start;
            const startTime = performance.now();
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                element.textContent = Math.round(start + range * easeProgress);
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        function updateUI(password) {
            const { score, details } = calculateScore(password);
            const status = getStatus(score);
            const maxScore = 23;
            const percentage = Math.min(score / maxScore, 1);

            // Show results
            resultsSection.style.opacity = '1';
            resultsSection.style.transform = 'translateY(0)';
            criteriaSection.style.opacity = '1';
            criteriaSection.style.transform = 'translateY(0)';

            // Animate score
            const currentScore = parseInt(scoreValue.textContent) || 0;
            animateValue(scoreValue, currentScore, score, 500);

            // Update circle
            const circumference = 2 * Math.PI * 70; // ~439.82
            const offset = circumference - (percentage * circumference);
            circleProgress.style.strokeDashoffset = offset;
            circleProgress.style.stroke = status.color;

            // Update glow classes
            scoreCard.className = 'score-card ' + status.glow;
            statusCard.className = 'status-card ' + status.glow;

            // Update status
            statusIcon.textContent = status.icon;
            statusIcon.style.color = status.color;
            statusText.textContent = status.level;
            statusText.style.color = status.color;
            statusText.style.textShadow = `0 0 20px ${status.color}40`;
            statusDesc.textContent = status.desc;

            // Update criteria
            criteriaGrid.innerHTML = details.map(d => `
                <div class="criterion">
                    <div class="criterion-icon ${d.pass ? 'pass' : 'fail'}">
                        ${d.pass ? '✓' : '✕'}
                    </div>
                    <div class="criterion-text">
                        <strong>${d.label}</strong><br>
                        <span style="color: ${d.pass ? 'var(--neon-green)' : 'var(--text-muted)'}; font-size: 0.75rem;">
                            ${d.extra || ''} ${d.points}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // Real-time analysis
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            if (password.length > 0) {
                updateUI(password);
            } else {
                resultsSection.style.opacity = '0';
                resultsSection.style.transform = 'translateY(10px)';
                criteriaSection.style.opacity = '0';
                criteriaSection.style.transform = 'translateY(10px)';
                scoreValue.textContent = '0';
                circleProgress.style.strokeDashoffset = 439.82;
            }
        });

        // Scan button
        scanBtn.addEventListener('click', () => {
            const password = passwordInput.value;
            if (!password) {
                passwordInput.focus();
                passwordInput.style.animation = 'none';
                passwordInput.offsetHeight; // trigger reflow
                passwordInput.style.animation = 'pulseBorder 0.5s ease';
                return;
            }
            mainCard.classList.add('scanning');
            setTimeout(() => {
                mainCard.classList.remove('scanning');
                updateUI(password);
            }, 600);
        });

        // Enter key
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                scanBtn.click();
            }
        });
    </script>
</body>
</html>
